[project]
name = "seam"
version = "0.1.0"
description = "Seam — local AI meeting minutes for macOS"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.136.1",
    "httpx>=0.28.1",
    "imageio-ffmpeg>=0.6.0",
    "keyring>=25.7.0",
    "mlx-whisper>=0.4.3",
    "psutil>=7.2.2",
    "pyobjc-framework-screencapturekit>=12.1",
    "pyannote.audio>=4.0.4",
    "pyyaml>=6.0.3",
    "scipy>=1.17.1",
    "silero-vad>=6.2.1",
    "sounddevice>=0.5.5",
    "torch>=2.12.0",
    "torchaudio>=2.11.0",
    "uvicorn[standard]>=0.47.0",
    "anthropic>=0.103.1",
    "openai>=2.37.0",
]
