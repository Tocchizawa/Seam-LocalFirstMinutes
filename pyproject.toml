[project]
name = "seam"
version = "0.1.0"
description = "Seam — local AI meeting minutes for macOS"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.135.3",
    "httpx>=0.28.1",
    "imageio-ffmpeg>=0.6.0",
    "keyring>=25.7.0",
    "mlx-whisper>=0.4.2",
    "psutil>=7.0.0",
    "pyobjc-framework-screencapturekit>=12.1",
    "pyannote.audio>=3.3.2",
    "pyyaml>=6.0.3",
    "scipy>=1.17.1",
    "silero-vad>=5.1",
    "sounddevice>=0.5.5",
    "torch>=2.4.0",
    "torchaudio>=2.4.0",
    "uvicorn[standard]>=0.43.0",
    "anthropic>=0.100.0",
    "openai>=2.36.0",
]
