name: Release DMG

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-dmg:
    name: Build DMG (macOS)
    runs-on: macos-14
    defaults:
      run:
        working-directory: gui
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"
          cache-dependency-path: gui/pnpm-lock.yaml

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Validate release signing secrets
        if: startsWith(github.ref, 'refs/tags/')
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_KEYCHAIN_PASSWORD: ${{ secrets.APPLE_KEYCHAIN_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          missing=0
          for key in \
            APPLE_CERTIFICATE_BASE64 \
            APPLE_CERTIFICATE_PASSWORD \
            APPLE_KEYCHAIN_PASSWORD \
            APPLE_SIGNING_IDENTITY \
            APPLE_ID \
            APPLE_APP_PASSWORD \
            APPLE_TEAM_ID \
            TAURI_SIGNING_PRIVATE_KEY; do
            if [ -z "${!key}" ]; then
              echo "::error::Missing required release signing secret: ${key}"
              missing=1
            fi
          done
          exit "$missing"

      - name: Import release signing certificate
        if: startsWith(github.ref, 'refs/tags/')
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_KEYCHAIN_PASSWORD: ${{ secrets.APPLE_KEYCHAIN_PASSWORD }}
        run: |
          CERTIFICATE_PATH="$RUNNER_TEMP/release-certificate.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/release-signing.keychain-db"

          echo "$APPLE_CERTIFICATE_BASE64" | base64 -D > "$CERTIFICATE_PATH"
          security create-keychain -p "$APPLE_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$APPLE_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$APPLE_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Bundle Backend Resources
        run: bash ../scripts/bundle-backend.sh

      - name: Build Tauri App Bundle
        run: pnpm tauri build --bundles app --ci

      - name: Create DMG
        env:
          RELEASE_DMG_REQUIRE_NOTARIZATION: ${{ startsWith(github.ref, 'refs/tags/') && '1' || '0' }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          cd ..
          bash scripts/create-dmg.sh

      - name: Generate updater artifact
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_UPDATER_REQUIRE_NOTARIZATION: "1"
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          cd ..
          bash scripts/create-updater-artifact.sh

      - name: Generate updater feed
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          cd ..
          VERSION="${GITHUB_REF_NAME#v}"
          bash scripts/create-updater-feed.sh "$VERSION" "$GITHUB_REF_NAME"

      - name: Upload DMG Artifact
        uses: actions/upload-artifact@v4
        with:
          name: seam-dmg
          path: gui/src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error

      - name: Upload Updater Artifacts
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v4
        with:
          name: seam-updater
          path: |
            gui/src-tauri/target/release/bundle/macos/*.app.tar.gz
            gui/src-tauri/target/release/bundle/macos/*.app.tar.gz.sig
            gui/src-tauri/target/release/bundle/updater/latest.json
          if-no-files-found: error

      - name: Publish GitHub Release Asset
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            gui/src-tauri/target/release/bundle/dmg/*.dmg
            gui/src-tauri/target/release/bundle/macos/*.app.tar.gz
            gui/src-tauri/target/release/bundle/macos/*.app.tar.gz.sig
            gui/src-tauri/target/release/bundle/updater/latest.json
          prerelease: ${{ contains(github.ref_name, '-') }}

      - name: Publish updater feed
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd ..
          FEED_TAG="updater-feed"
          if ! gh release view "$FEED_TAG" >/dev/null 2>&1; then
            gh release create "$FEED_TAG" \
              --title "Seam updater feed" \
              --notes "Static Tauri updater feed for Seam." \
              --latest=false
          fi
          gh release upload "$FEED_TAG" \
            gui/src-tauri/target/release/bundle/updater/latest.json \
            --clobber
