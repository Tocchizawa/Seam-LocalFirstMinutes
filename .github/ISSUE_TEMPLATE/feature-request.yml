name: 機能提案
description: 新機能・改善アイデアを提案する
title: "[提案] "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        「何を解決したいか」を先に書いてもらえると、実装の検討がしやすくなります。

  - type: textarea
    id: problem
    attributes:
      label: 背景 / 課題
      description: いま困っていること・解決したいこと
      placeholder: 例) 長時間録音時に要約完了までの待ち時間が読めない
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 提案内容
      description: 期待する仕様やUIを具体的に書いてください
      placeholder: 例) 進捗を「文字起こし / 要約 / 保存」で段階表示したい
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 代替案 / 補足
      description: 他に考えた案やトレードオフ

  - type: dropdown
    id: impact
    attributes:
      label: 影響範囲
      options:
        - 小（UI文言・軽微な改善）
        - 中（既存機能の拡張）
        - 大（設計変更を含む）
    validations:
      required: true

  - type: checkboxes
    id: checks
    attributes:
      label: 確認事項
      options:
        - label: 同様の提案が既存Issueにないことを確認した
          required: true
