version: 2

# Keep Dependabot quiet by default. Security updates are grouped per ecosystem.
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 0
    groups:
      github-actions-security:
        applies-to: "security-updates"
        patterns:
          - "*"
    labels:
      - "dependencies"
      - "security"

  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 0
    groups:
      python-security:
        applies-to: "security-updates"
        patterns:
          - "*"
    labels:
      - "dependencies"
      - "security"
